<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Karan Choudhary</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Syne',sans-serif;
    background:#020617;
    color:#e5e7eb;
    min-height:100vh;
}

/* LOGIN */
.login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.login-box{
    background:rgba(255,255,255,.07);
    padding:40px;
    border-radius:25px;
    width:320px;
    box-shadow:0 30px 90px rgba(0,0,0,.8);
}
.login-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#38bdf8;
}
.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:#fff;
}
.login-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#38bdf8;
    font-weight:700;
    cursor:pointer;
}

/* ADMIN PANEL */
#adminPanel{
    display:none;
    padding:40px;
}
.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}
.top-bar h1{color:#38bdf8}

.actions{
    margin-bottom:20px;
}
.actions button{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    margin-right:10px;
    cursor:pointer;
    font-weight:600;
}
.deleteAll{background:#ef4444;color:white}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}
th,td{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,.1);
}
th{color:#38bdf8}
.deleteBtn{
    background:#ef4444;
    border:none;
    padding:6px 12px;
    border-radius:20px;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="top-bar">
        <h1>Admin Panel</h1>
    </div>

    <div class="actions">
        <button class="deleteAll" onclick="deleteAll()">Delete All</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Service</th>
                <th>Time</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
</div>

<!-- 🔥 FIREBASE SCRIPT -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ✅ FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCoi0Lbcr9J-sAB2eYcCxWvAzHDEDjZS1I",
  authDomain: "personal-web-admin.firebaseapp.com",
  databaseURL: "https://personal-web-admin-default-rtdb.firebaseio.com",
  projectId: "personal-web-admin",
  storageBucket: "personal-web-admin.firebasestorage.app",
  messagingSenderId: "470159508464",
  appId: "1:470159508464:web:7eddaad64e671bd1d99335"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* LOGIN */
window.login = function(){
    if(username.value==="karan" && password.value==="karan128"){
        document.getElementById("login").style.display="none";
        document.getElementById("adminPanel").style.display="block";
        loadData();
    }else{
        alert("Wrong login details");
    }
};

/* LOAD DATA */
function loadData(){
    const tbody = document.getElementById("data");
    onValue(ref(db, "contacts"), snapshot => {
        tbody.innerHTML = "";
        snapshot.forEach(child => {
            const d = child.val();
            const key = child.key;
            tbody.innerHTML += `
            <tr>
                <td>${d.name}</td>
                <td>${d.mobile}</td>
                <td>${d.service}</td>
                <td>${d.time}</td>
                <td>
                  <button class="deleteBtn" onclick="deleteOne('${key}')">Delete</button>
                </td>
            </tr>`;
        });
    });
}

/* DELETE ONE */
window.deleteOne = function(key){
    remove(ref(db, "contacts/" + key));
};

/* DELETE ALL */
window.deleteAll = function(){
    if(confirm("Delete all data?")){
        remove(ref(db, "contacts"));
    }
};
</script>

</body>
</html>
