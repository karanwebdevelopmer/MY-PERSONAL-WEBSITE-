<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Karan Choudhary</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap');

*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Syne',sans-serif;
    background:#020617;
    color:#e5e7eb;
    min-height:100vh;
}

/* LOGIN */
.login{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:rgba(255,255,255,.07);
    padding:40px;
    border-radius:25px;
    width:320px;
    box-shadow:0 30px 90px rgba(0,0,0,.8);
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#38bdf8;
}

.login-box input{
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,.1);
    color:#fff;
}

.login-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:30px;
    background:#38bdf8;
    font-weight:700;
    cursor:pointer;
}

/* ADMIN PANEL */
#adminPanel{
    display:none;
    padding:40px;
}

.top-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

.top-bar h1{color:#38bdf8}

.top-bar a{
    color:#38bdf8;
    text-decoration:none;
    font-weight:600;
}

/* ACTION BUTTONS */
.actions{
    margin-bottom:20px;
}

.actions button{
    padding:10px 20px;
    border:none;
    border-radius:25px;
    margin-right:10px;
    cursor:pointer;
    font-weight:600;
}

.deleteAll{background:#ef4444;color:white}
.export{background:#22c55e;color:#020617}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:14px;
    border-bottom:1px solid rgba(255,255,255,.1);
    text-align:left;
}

th{color:#38bdf8}

.deleteBtn{
    background:#ef4444;
    border:none;
    padding:6px 12px;
    border-radius:20px;
    color:white;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
    table{font-size:.9rem}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login" id="login">
    <div class="login-box">
        <h2>Admin Login</h2>
        <input type="text" id="username" placeholder="Username">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
    <div class="top-bar">
        <h1>Admin Panel</h1>
        <a href="https://www.instagram.com/the_web_developer_1000?igsh=N293bmRheXVycWZx" target="_blank">
            📩 Instagram
        </a>
    </div>

    <div class="actions">
        <button class="deleteAll" onclick="deleteAll()">Delete All</button>
        <button class="export" onclick="exportData()">Export Data</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Service</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>
</div>

<script>
const ADMIN_USER="admin";
const ADMIN_PASS="12345";

/* LOGIN */
function login(){
    if(username.value===ADMIN_USER && password.value===ADMIN_PASS){
        document.getElementById("login").style.display="none";
        document.getElementById("adminPanel").style.display="block";
        loadData();
    }else{
        alert("Wrong login details!");
    }
}

/* LOAD DATA */
function loadData(){
    const contacts=JSON.parse(localStorage.getItem("contacts")||"[]");
    const tbody=document.getElementById("data");
    tbody.innerHTML="";
    contacts.forEach((c,i)=>{
        tbody.innerHTML+=`
        <tr>
            <td>${c.name}</td>
            <td>${c.mobile}</td>
            <td>${c.service}</td>
            <td><button class="deleteBtn" onclick="deleteOne(${i})">Delete</button></td>
        </tr>`;
    });
}

/* DELETE ONE */
function deleteOne(i){
    const contacts=JSON.parse(localStorage.getItem("contacts"));
    contacts.splice(i,1);
    localStorage.setItem("contacts",JSON.stringify(contacts));
    loadData();
}

/* DELETE ALL */
function deleteAll(){
    if(confirm("Delete all data?")){
        localStorage.removeItem("contacts");
        loadData();
    }
}

/* EXPORT DATA */
function exportData(){
    const data=localStorage.getItem("contacts");
    if(!data){alert("No data to export");return}
    const blob=new Blob([data],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="contacts-data.json";
    a.click();
}
</script>

</body>
</html>
