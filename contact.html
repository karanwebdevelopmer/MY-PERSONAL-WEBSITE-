
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Karan Choudhary</title>

<style>
    
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
    font-family:'Syne',sans-serif;
    background:#020617;
    color:#e5e7eb;
    overflow-x:hidden;
    perspective:2600px;
    position:relative;
}
body::before{
    content:'';
    position:fixed;
    inset:0;
    background:radial-gradient(500px at var(--mx,50%) var(--my,50%), rgba(56,189,248,.22), transparent 45%);
    pointer-events:none;
    mix-blend-mode:screen;
    z-index:-1;
}
header{
    height:40vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
header h1{font-size:3rem;color:white}
main{max-width:600px;margin:auto;padding:50px 20px}
form{
    display:flex;
    flex-direction:column;
    gap:20px;
    background:rgba(255,255,255,.05);
    padding:30px;
    border-radius:25px;
}
form label{color:#38bdf8;font-weight:600}
form input,form textarea{
    padding:12px;
    border-radius:12px;
    border:none;
    background:rgba(255,255,255,.1);
    color:white;
}
button{
    padding:12px;
    border:none;
    border-radius:20px;
    background:#38bdf8;
    font-weight:700;
    cursor:pointer;
}
</style>
</head>

<body>

<header><h1>Contact Me</h1></header>

<main>
<form id="contactForm">
    <label>Your Name</label>
    <input type="text" id="name" required>

    <label>Mobile Number</label>
    <input type="number" id="mobile" required>

    <label>Selected Service</label>
    <textarea id="services" required></textarea>

    <button type="submit">Submit</button>
</form>
</main>

<!-- 🔥 FIREBASE + FORM LOGIC -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ✅ AAPKA FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCoi0Lbcr9J-sAB2eYcCxWvAzHDEDjZS1I",
  authDomain: "personal-web-admin.firebaseapp.com",
  databaseURL: "https://personal-web-admin-default-rtdb.firebaseio.com",
  projectId: "personal-web-admin",
  storageBucket: "personal-web-admin.firebasestorage.app",
  messagingSenderId: "470159508464",
  appId: "1:470159508464:web:7eddaad64e671bd1d99335"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* AUTO FILL SERVICE */
const selectedService = localStorage.getItem("selectedService");
if(selectedService){
  document.getElementById("services").value = selectedService;
}

/* FORM SUBMIT */
document.getElementById("contactForm").addEventListener("submit", e => {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const mobile = document.getElementById("mobile").value.trim();
  const service = document.getElementById("services").value.trim();

  if(!name || !mobile || !service){
    alert("Please fill all fields");
    return;
  }

  push(ref(db, "contacts"), {
    name,
    mobile,
    service,
    time: new Date().toLocaleString()
  });

  alert("✅ Your request has been submitted successfully");
  e.target.reset();
});
</script>

</body>
</html>
